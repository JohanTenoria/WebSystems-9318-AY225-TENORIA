<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamesRadar+ Scraper – Game List</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 GamesRadar+ Game Data</h1>
            <p>Scraped from genre sections – detailed game info & latest articles</p>
        </header>

        <div class="filters">
            <label for="genre-filter">Filter by Genre:</label>
            <select id="genre-filter">
                <option value="all">All Genres</option>
            </select>
        </div>

        <div id="games-container" class="games-list">
            <div class="loading">Loading data...</div>
        </div>

        <footer>
            <p>Data sourced from <a href="https://www.gamesradar.com" target="_blank" rel="noopener noreferrer">GamesRadar+</a> | Updated: <span id="update-date"></span></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
